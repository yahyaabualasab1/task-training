<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Repository Finder</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>GitHub Repository Finder</h1>
        
        <!-- Dropdown لاختيار اللغة -->
        <select id="languageSelect">
            <option value="">Select a Language</option>
            <option value="javascript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="C++">C++</option>
            <option value="C#">C#</option>
            <option value="PHP">PHP</option>
            <option value="TypeScript">TypeScript</option>
        </select>
        
        <!-- صندوق عرض الرسالة أو الريبو -->
        <div id="repoContainer" class="message">
            Please select a language
        </div>
        
        <!-- زر التحديث -->
        <button id="refreshBtn" style="display:none;">Refresh</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
